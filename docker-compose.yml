  jaeger:
    image: jaegertracing/jaeger:2.15.1
    ports:
      - "16686:16686"
      - "4318:4318"

  redis:
    image: redis:8.6
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD} --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:2026.01.4
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["genai"]'
      NEO4J_dbms_usage__report.enabled: false
      NEO4J_server_jvm_additional: "--add-modules jdk.incubator.vector"
    depends_on:
      - tei-embeddings
    volumes:
      - neo4j-data:/data
      - neo4j-plugins:/plugins
      - ./neo4j/genai.conf:/var/lib/neo4j/conf/genai.conf
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id ${HF_EMBEDDING_MODEL}
    volumes:
      - embeddings-data:/data

volumes:
  trace-data:
  embeddings-data:
  redis-data:
  neo4j-data:
  neo4j-plugins:
