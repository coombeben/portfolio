  redis:
    image: redis:8.6
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD} --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:2026.01.4-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
#      NEO4J_dbms_jvm_additional: "--add-modules jdk.incubator.vector"
      NEO4J_server_jvm_additional: "--add-modules jdk.incubator.vector"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  embeddings-data:
  redis-data:
  neo4j-data:
