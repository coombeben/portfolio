# Example Nginx configuration for proxying to Next.js and FastAPI backends
server {
    listen 80;
    server_name ben.coombe.xyz;

    # 1. Specific Next.js API route
    location /api/copilotkit {
        proxy_pass http://_:3000;
        include proxy_params;

        # Streaming responses
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2. General FastAPI backend routes
    location /api/ {
        proxy_pass http://_:8000;
        include proxy_params;

        # Streaming responses
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # 3. Everything else (Frontend + Static Files) goes to Next.js
    location / {
        proxy_pass http://_:3000;
        include proxy_params;
    }
}